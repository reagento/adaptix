[build-system]
requires = ["uv_build == 0.8.22"]
build-backend = "uv_build"

[project]
name = 'adaptix'
version = '3.0.0b11'
description = 'An extremely flexible and configurable data model conversion library'
readme = 'README.md'
requires-python = '>=3.9'
license = 'Apache-2.0'
license-files = ['LICENSE']
dependencies = [
    'exceptiongroup>=1.1.3; python_version<"3.11"',
]

classifiers = [
    'Development Status :: 3 - Alpha',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Operating System :: OS Independent',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'Intended Audience :: System Administrators',
    'License :: OSI Approved :: Apache Software License',
    'Typing :: Typed',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Internet',
]

[project.optional-dependencies]
attrs = ['attrs >= 21.3.0']
attrs-strict = ['attrs >= 21.3.0, <= 24.2.0']
sqlalchemy = ['sqlalchemy >= 2.0.0']
sqlalchemy-strict = ['sqlalchemy >= 2.0.0, <= 2.0.36']
pydantic = ['pydantic >= 2.1.0']
pydantic-strict = ['pydantic >= 2.1.0, <= 2.12.3']
msgspec = ['msgspec >= 0.18.5']
msgspec-strict = ['msgspec >= 0.18.5, <= 0.19.0']

[project.urls]
'Homepage' = 'https://github.com/reagento/adaptix'
'Bug Tracker' = 'https://github.com/reagento/adaptix/issues'
'Documentation' = 'https://adaptix.readthedocs.io/en/latest/'
'Changelog' = 'https://adaptix.readthedocs.io/en/latest/reference/changelog.html'
'Source' = 'https://github.com/reagento/adaptix/'
'Download' = 'https://github.com/reagento/adaptix/#files'


[[project.authors]]
name = 'A. Tikhonov'
email = '17@itishka.org'


#   ┌             ┐
#   │   TESTING   │
#   └             ┘


[tool.pytest.ini_options]
python_classes = 'WeDoNotUseClassTestCase'
python_files = [
  'test_*.py',
  '*_test.py',
  'bench_[!nexus]*.py',
  'tests/tests_helpers/tests_helpers/*.py',
  'local_helpers.py',
]
testpaths = ['tests', 'examples']

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
relative_files = true
include = ["src/**"]

[tool.coverage.report]
exclude_also = [
    "^\\s*\\.\\.\\.\\s*(:?#.*)?$",
]


#   ┌                     ┐
#   │   CI DEPENDENCIES   │
#   └                     ┘


[dependency-groups]
pytest = [
    "pytest==8.3.5"
]

test-extra-none = [
    {include-group = "pytest"},
    "tests_helpers",  # local package
    "phonenumberslite==9.0.5",
    "dirty-equals==0.9.0",
    "coverage==7.8.1",
    "jsonschema-rs==0.30.0; implementation_name != 'pypy' and python_version < '3.14'",
]

test-extra-old = [
    {include-group = "test-extra-none"},
    "attrs==21.3.0",
    "sqlalchemy==2.0.0",
    "pydantic==2.1.0",
    "msgspec==0.18.5; implementation_name != 'pypy'",
]

test-extra-old-py313 = [
    {include-group = "test-extra-none"},
    "attrs==21.3.0",
    "sqlalchemy==2.0.31",
    "pydantic==2.8.2",
    "msgspec==0.19.0; implementation_name != 'pypy'",
]

test-extra-new = [
    {include-group = "test-extra-none"},
    "attrs==24.2.0",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.3",
    "msgspec==0.19.0; implementation_name != 'pypy'",
]

bench = [
    {include-group = "pytest"},
    "benchmarks",  # local package

    "pyperf==2.6.1",
    "psutil==5.9.5",

    "mashumaro==3.10",
    "pydantic==2.10.3",
    "cattrs==23.1.2",
    "schematics==2.1.1",
    "dataclass-factory==2.16",
    "marshmallow==3.20.1",
    "msgspec==0.19.0; implementation_name != 'pypy'",
]

doc = [
    {include-group = "bench"},

    "sphinx==8.2.3",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.6.1",
    "sphinx-paramlinks==0.6.0",
    "myst-parser==4.0.1",
    "sphinxext-opengraph==0.10.0",
    "sphinx-better-subsection==0.2",
    "sphinx-reredirects==0.1.6",
    "sphinxcontrib-globalsubs==0.1.2",
    "sphinxcontrib-apidoc==0.6.0",
    "furo==2024.8.6",

    "docutils-stubs==0.0.22",

    "gitpython==3.1.44",
    "plotly==6.1.1",
]

runner = [
    "tox-uv==1.25.0",
    "invoke==2.2.0",
    "coverage==7.8.1",
]

lint = [
    {include-group = "test-extra-new"},
    {include-group = "doc"},

    "prek==0.2.5",

    "mypy[faster-cache]==1.15.0",

    "vulture==2.10",

    "ruff==0.14.0",

    "radon==6.0.1",
    "dlint==0.14.1",
    "typos==1.39.0",

    "astpath[xpath]==0.9.1",
]

dev = [
    {include-group = "runner"},
    {include-group = "lint"},
    "towncrier==24.8.0",
]

[tool.uv.dependency-groups]
test-extra-old-py313 = {requires-python = ">=3.13"}
doc = {requires-python = ">=3.11"}


[tool.uv]
conflicts = [
    [
      { group = "test-extra-old" },
      { group = "test-extra-old-py313" },
      { group = "test-extra-new" },
      { group = "bench" },
    ],
]

[tool.uv.sources]
benchmarks = { path = "./benchmarks", editable = true }
tests_helpers = { path = "./tests/tests_helpers", editable = true }

#   ┌             ┐
#   │   LINTING   │
#   └             ┘

[tool.mypy]
ignore_missing_imports = true

show_error_codes = true
warn_unused_configs = true
no_implicit_optional = true

warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_subclassing_any = true
# disallow_any_generics = true # maybe turn on in the future
local_partial_types = true


[tool.isort]
multi_line_output = 3
line_length = 120
include_trailing_comma = true
combine_as_imports = true
remove_redundant_aliases = true


[tool.vulture]
min_confidence = 60
ignore_decorators = ['@_aspect_storage.add', '@overload', '@abstractmethod']


[tool.ruff]
line-length = 120
output-format = "concise"

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = [
    "tomllib",  # because requires-python = '>=3.9'
]

[tool.ruff.lint]

allowed-confusables = ['×', '‹', '›']

select = ['ALL']
fixable = [
  'Q000',
  'Q001',
  'COM812',
  'D400',
  'PT001',
  'RUF023',
  'RUF022',
  'I001',
]
ignore = [
  # Rules that should be turned on soon
  'D',
  'N818',
  'B904',
  'FIX002',
  'RUF012',

  'PYI019',  # turn on after 3.11

  # Rules emitting false alerts
  'N804',
  'B008',
  'BLE001',
  'RUF009',
  'PD011',

  # Rules that are not applicable in the project for now
  'TID252',
  'D104',
  'ANN',
  'SLF001',
  'ARG',
  'D100',
  'PLR0913',
  'TC002',

  # Strange and obscure rules that will never be turned on
  'FA100',
  'TRY003',
  'TRY201',
  'EM',
  'PERF203',
  'TC001',
  'TD002',
  'PTH201',
  'RSE102',
  'TC003',
  'PYI025',
  'TC006',
  'C420',
  'PYI061',
  'PLW1641',
  'FURB157',
]

[tool.ruff.per-file-target-version]
"tests/*_312.py" = "py312"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ['F401']

"tests/*" = [
  'S101',
  'PLR2004',
  'N806',
  'FA102',
  'UP006', # turn on after 3.9
  'UP035', # turn on after 3.9
  'UP044', # turn on after 3.9
  'UP045', # turn on after 3.9
  'UP049',
  'E501',
  'PLC0105',
  'PLC0415',
  'PYI061',
  'PLW1641',
  'FURB157',
]
"tests/*/local_helpers.py" = ['S101', 'PLR2004', 'PLC0105', 'N806', 'FA102']
"tests/*/data_*.py" = ['F821']
"tests/tests_helpers/*" = ['INP001', 'S101']

"docs/examples/*" = [
  # test ignores
  'S101', 'PLR2004', 'PLC0105', 'N806', 'PT017', 'SIM105', 'FA102',
  # unique ignores
  'SLOT000', 'S106', 'DTZ001'
]

"examples/*" = [
  'UP035', 'UP006', # turn on after 3.9
  'PLW1641', 'S101'
]

"scripts/*" = ['INP001', 'PT028']

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "list"


#   ┌             ┐
#   │    OTHER    │
#   └             ┘


[tool.towncrier]
package = 'adaptix'
filename = 'docs/changelog/changelog_body.rst'
template = 'docs/changelog/template.rst.jinja2'
issue_format = '`#{issue} <https://github.com/reagento/adaptix/issues/{issue}>`__'
directory = 'docs/changelog/fragments'

type = [
  { name = "Features",         directory = "feature",     showcontent = true },
  { name = "Breaking Changes", directory = "breaking",    showcontent = true },
  { name = "Deprecations",     directory = "deprecation", showcontent = true },
  { name = "Bug Fixes",        directory = "bugfix",      showcontent = true },
  { name = "Other",            directory = "other",       showcontent = true },
]
