[vars]
# Do not forget to update paths at .pre-commit-config.yaml
lint_mypy   = src/ scripts/ examples/ benchmarks/benchmarks/pybench/ docs/examples/ docs/custom_ext/
lint_all    = src/ scripts/ examples/ benchmarks/benchmarks/pybench/ docs/examples/ docs/custom_ext/ tests/
lint_typos  = src/ scripts/ examples/ benchmarks/                    docs/                           tests/ README.md

[tox]
env_list = {py39, py310, py311, py312, py313, pypy39, pypy310}-extra_{none, old, new},
           lint,
           {py39, py310, py311, py312, py313, pypy39, pypy310}-bench

[testenv]
runner = uv-venv-lock-runner
package = skip
dependency_groups =
  extra_none:                                              test-extra-none
  {py39, py310, py311, py312, pypy39, pypy310}-extra_old:  test-extra-old
  py313-extra_old:                                         test-extra-old-py313
  extra_new:                                               test-extra-new

commands =
  pytest {posargs}


[testenv:{py39, py310, py311, py312, py313, pypy39, pypy310}-bench]
runner = uv-venv-lock-runner
package = skip
dependency_groups = bench

commands =
  pytest {posargs} benchmarks


[testenv:lint]
runner = uv-venv-lock-runner
package = skip
dependency_groups = lint

base_python = python3.11

ignore_errors = true
allowlist_externals = ruff

commands =
  typos {[vars]lint_typos}
  ruff check {[vars]lint_all} --fix
  mypy {[vars]lint_mypy}
  prek run --all-files
  python scripts/astpath_lint.py {[vars]lint_all}
  # vulture {[vars]lint_all}   # currently it creates too many false-positive alerts
  # TODO: add more linters
